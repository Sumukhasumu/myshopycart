spring:
  application:
    name: cart-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/myshopycart_cart
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

product-service:
  base-url: http://localhost:8082

myshopycart:
  auth:
    jwt-secret: "myshopycart-phase4-jwt-secret-key-change-this-later"

logging:
  level:
    org.springframework.security: DEBUG