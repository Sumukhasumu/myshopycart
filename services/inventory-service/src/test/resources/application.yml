spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/myshopycart_inventory
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    enabled: false

myshopycart:
  auth:
    jwt-secret: "myshopycart-phase4-jwt-secret-key-change-this-later"
  inventory:
    internal-token: "test-internal-token"